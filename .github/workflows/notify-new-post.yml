name: Notify Buttondown on new blog post

on:
  push:
    branches:
      - main
    paths:
      - 'nl/blog/**.html'
      - 'en/blog/**.html'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect newly added blog posts
        id: detect
        run: |
          echo "Comparing ${{ github.event.before }} to ${{ github.sha }}"
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit (first push), skipping diff."
            echo "files=" >> "$GITHUB_OUTPUT"
          else
            FILES=$(git diff --diff-filter=A --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'nl/blog/*.html' 'en/blog/*.html' || true)
            echo "New files: $FILES"
            {
              echo "files<<EOF"
              echo "$FILES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Add Giscus comments section to new posts
        if: steps.detect.outputs.files != ''
        env:
          NEW_FILES: ${{ steps.detect.outputs.files }}
        run: |
          cat > /tmp/add_giscus.py <<'PYEOF'
          import os
          new_files = os.environ["NEW_FILES"].strip().splitlines()
          TPL = ('<section class="comments"><script src="https://giscus.app/client.js" '
                 'data-repo="triplebhealing/triplebhealing.github.io" data-repo-id="R_kgDOTuxD1A" '
                 'data-category="Announcements" data-category-id="DIC_kwDOTuxD1M4DDIzb" '
                 'data-mapping="pathname" data-strict="0" data-reactions-enabled="1" '
                 'data-emit-metadata="0" data-input-position="bottom" '
                 'data-theme="preferred_color_scheme" data-lang="{lang}" '
                 'crossorigin="anonymous" async></script></section>')
          for path in new_files:
              path = path.strip()
              if not path or not path.endswith(".html") or not os.path.exists(path):
                  continue
              with open(path, encoding="utf-8") as f:
                  content = f.read()
              if "giscus.app" in content:
                  continue
              lang = "nl" if path.startswith("nl/") else "en"
              snippet = TPL.format(lang=lang)
              if "</main>" in content:
                  content = content.replace("</main>", snippet + "\n</main>", 1)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print("Added giscus comments to " + path)
          PYEOF
          python3 /tmp/add_giscus.py

      - name: Commit Giscus comment sections
        if: steps.detect.outputs.files != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Auto-add Giscus comments section to new blog post(s)"
            git push
          else
            echo "No changes to commit."
          fi


      - name: Create Buttondown draft for each new post
        if: steps.detect.outputs.files != ''
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          NEW_FILES: ${{ steps.detect.outputs.files }}
        run: |
          cat > /tmp/notify_buttondown.py <<'PYEOF'
          import os
          import re
          import json
          import urllib.request

          api_key = os.environ["BUTTONDOWN_API_KEY"]
          new_files = os.environ["NEW_FILES"].strip().splitlines()

          base_url = "https://triplebhealing.github.io"

          def extract(html_path):
              with open(html_path, encoding="utf-8") as f:
                  content = f.read()
              title_match = re.search(r"<h1>(.*?)</h1>", content, re.S)
              title = title_match.group(1).strip() if title_match else html_path
              desc_match = re.search(r"</h1>\s*<p>(.*?)</p>", content, re.S)
              description = re.sub("<.*?>", "", desc_match.group(1)).strip() if desc_match else ""
              return title, description

          for path in new_files:
              path = path.strip()
              if not path:
                  continue
              title, description = extract(path)
              url_path = path if path.startswith("/") else "/" + path
              full_url = base_url + url_path

              lang = "nl" if path.startswith("nl/") else "en"
              if lang == "nl":
                  subject = "Nieuwe blogpost: " + title
                  body_lines = [
                      "Er staat een nieuwe blogpost online: **" + title + "**",
                      "",
                      description,
                      "",
                      "Lees het volledige artikel: " + full_url,
                  ]
              else:
                  subject = "New blog post: " + title
                  body_lines = [
                      "A new blog post is live: **" + title + "**",
                      "",
                      description,
                      "",
                      "Read the full article: " + full_url,
                  ]
              body = "\n".join(body_lines)

              payload = json.dumps({
                  "subject": subject,
                  "body": body,
                  "status": "draft",
              }).encode("utf-8")

              req = urllib.request.Request(
                  "https://api.buttondown.com/v1/emails",
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": "Token " + api_key,
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      print("Created draft for " + path + ": " + str(resp.status))
              except urllib.error.HTTPError as e:
                  print("Failed for " + path + ": " + str(e.code) + " " + e.read().decode())
                  raise
          PYEOF
          python3 /tmp/notify_buttondown.py
